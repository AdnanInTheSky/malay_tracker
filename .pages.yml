media:
  input: assets/images
  output: /assets/images

content:
  # -------------------------------------------------------------
  # Section 1: Hero
  # -------------------------------------------------------------
  - name: hero_header
    label: "01. Hero - Header & Text"
    type: file
    path: content/hero/section.md
    fields:
      - name: eyebrow
        label: "Eyebrow"
        type: string
      - name: h1
        label: "Main Headline"
        type: string
      - name: sub
        label: "Subheadline"
        type: text
      - name: reassurance
        label: "Reassurance Badges"
        type: string
        list: true

  - name: hero_slides
    label: "01. Hero - Background Media Slides"
    type: collection
    path: content/hero
    exclude:
      - section.md
    view:
      primary: order
      fields: [order, type, src]
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: order
        label: "Slide Order"
        type: number
      - name: type
        label: "Media Type"
        type: select
        options:
          values: [image, video, youtube]
      - name: src
        label: "Media Source (URL or Path)"
        type: string
      - name: alt
        label: "Alt Text"
        type: string

  # -------------------------------------------------------------
  # Section 2: Mandates
  # -------------------------------------------------------------
  - name: mandates_header
    label: "02. Mandates - Header"
    type: file
    path: content/mandates/section.md
    fields:
      - name: eyebrow
        label: "Eyebrow"
        type: string
      - name: h2
        label: "Heading (HTML allowed)"
        type: string
      - name: body
        label: "Introduction Text"
        type: rich-text

  - name: mandates_cards
    label: "02. Mandates - Step Cards"
