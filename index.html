<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Expense Form</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-black min-h-screen">

  <main class="max-w-lg mx-auto px-5 py-10">

    <div class="mb-8">
      <h1 class="text-3xl font-bold">
        Add Expense
      </h1>

      <p class="text-gray-500 mt-2">
        Record a group payment.
      </p>
    </div>


    <form
      id="expenseForm"
      class="space-y-5"
    >

      <!-- Date -->
      <div>
        <label class="block text-sm font-medium mb-2">
          Date
        </label>

        <input
          type="date"
          name="date"
          required
          class="w-full border border-black px-4 py-3 outline-none"
        >
      </div>


      <!-- Description -->
      <div>
        <label class="block text-sm font-medium mb-2">
          Description
        </label>

        <input
          type="text"
          name="description"
          placeholder="Dinner, transport, tickets..."
          required
          class="w-full border border-black px-4 py-3 outline-none"
        >
      </div>


      <!-- Paid By -->
      <div>
        <label class="block text-sm font-medium mb-2">
          Paid By
        </label>

        <select
          name="paidBy"
          required
          class="w-full border border-black px-4 py-3 bg-white outline-none"
        >
          <option value="">Select person</option>
          <option value="Adnan">Adnan</option>
          <option value="Luban">Luban</option>
          <option value="Saad">Saad</option>
          <option value="Atiq">Atiq</option>
        </select>
      </div>


      <!-- Amount -->
      <div>
        <label class="block text-sm font-medium mb-2">
          Amount
        </label>

        <input
          type="number"
          name="amount"
          placeholder="0"
          min="0"
          step="0.01"
          required
          class="w-full border border-black px-4 py-3 outline-none"
        >
      </div>


      <!-- Submit -->
      <button
        type="submit"
        id="submitButton"
        class="w-full bg-black text-white py-3 hover:bg-gray-800"
      >
        Add Expense
      </button>

    </form>


    <!-- Status -->
    <div
      id="status"
      class="hidden mt-5 border border-black p-4 text-sm"
    ></div>

  </main>


<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzO440OujMbSF4SirnNiJNbm28G4wPA03HBEe7OYbHfTseVVweDtonBdra091s_r9qi/exec";

const form = document.getElementById("expenseForm");
const button = document.getElementById("submitButton");
const status = document.getElementById("status");


form.addEventListener("submit", async function (event) {

  event.preventDefault();

  button.disabled = true;
  button.textContent = "Submitting...";

  status.classList.add("hidden");


  const formData = new FormData(form);

  const data = {

    date: formData.get("date"),

    description: formData.get("description"),

    paidBy: formData.get("paidBy"),

    amount: formData.get("amount")

  };


  try {

    await fetch(SCRIPT_URL, {

      method: "POST",

      mode: "no-cors",

      headers: {
        "Content-Type": "text/plain"
      },

      body: JSON.stringify(data)

    });


    status.textContent = "Expense added successfully.";
    status.classList.remove("hidden");


    form.reset();

    // Set today's date again
    form.querySelector('[name="date"]').value =
      new Date().toISOString().split("T")[0];


  } catch (error) {

    status.textContent =
      "Something went wrong. Please try again.";

    status.classList.remove("hidden");

  }


  button.disabled = false;
  button.textContent = "Add Expense";

});


// Set today's date automatically
form.querySelector('[name="date"]').value =
  new Date().toISOString().split("T")[0];

</script>

</body>
</html>
