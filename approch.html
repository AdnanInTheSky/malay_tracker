<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP3 - Policy to Implementation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .orbit-ring { animation: orbitSpin 30s linear infinite; }
        @keyframes orbitSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .pulse-ring { animation: pulseRing 3s ease-in-out infinite; }
        @keyframes pulseRing { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.15); opacity: 0.1; } }

        .active-dot-pulse { animation: activeDotPulse 2s ease-in-out infinite; }
        @keyframes activeDotPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(153, 27, 27, 0.4); } 50% { box-shadow: 0 0 0 12px rgba(153, 27, 27, 0); } }

        .fade-in-up { opacity: 0; transform: translateY(40px); transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-in-up.visible { opacity: 1; transform: translateY(0); }

        .card-hover { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .card-hover:hover { transform: translateY(-6px); box-shadow: 0 24px 48px rgba(0,0,0,0.08); }

        .slide-track { animation: scroll 35s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .slide-track:hover { animation-play-state: paused; }

        .string-path { stroke-dasharray: 1000; stroke-dashoffset: 1000; }
        .string-path.drawn { animation: drawString 2.5s ease-in-out forwards; }
        @keyframes drawString { to { stroke-dashoffset: 0; } }

        .orbit-node { transition: all 0.3s ease; cursor: pointer; }
        .orbit-node:hover { transform: scale(1.2); }

        .desc-row { transition: all 0.4s ease; border-left: 3px solid transparent; }
        .desc-row.active { border-left-color: #991b1b; background: rgba(153, 27, 27, 0.03); padding-left: 1.25rem; }

        .tag-pill { transition: all 0.3s ease; }
        .tag-pill:hover { background: #991b1b; color: white; border-color: #991b1b; }

        .modal-overlay { backdrop-filter: blur(8px); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f5f5f4; }
        ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a29e; }

        .parallax-bg { background-attachment: fixed; background-position: center; background-repeat: no-repeat; background-size: cover; }
        @media (max-width: 768px) { .parallax-bg { background-attachment: scroll; } }

        .parallax-overlay { background: linear-gradient(135deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.7) 50%, rgba(0,0,0,0.85) 100%); }
        .parallax-overlay-light { background: linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0.8) 100%); }

        .collab-card { transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .collab-card:hover { transform: translateY(-4px); }

        .collab-item { transition: all 0.3s ease; }
        .collab-item:hover { transform: translateX(8px); background: rgba(153, 27, 27, 0.05); }

        .together-tag { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); position: relative; overflow: hidden; }
        .together-tag::before { content: ''; position: absolute; inset: 0; background: #991b1b; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 0; }
        .together-tag:hover::before { transform: translateY(0); }
        .together-tag:hover { color: white; border-color: #991b1b; }
        .together-tag span { position: relative; z-index: 1; }

        .divider-line { background: linear-gradient(to bottom, transparent, #991b1b, transparent); }

        .icon-box { transition: all 0.4s ease; }
        .collab-item:hover .icon-box { background: #991b1b; color: white; transform: rotate(5deg) scale(1.1); }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-white text-gray-800 antialiased">

    <!-- ============================================ -->
    <!-- SECTION 1: Policy to Implementation (WITH BG) -->
    <!-- ============================================ -->
    <section class="relative py-32 px-6 min-h-screen flex items-center" id="section1"
             x-data="section1Data()" x-init="init()">

        <!-- Background Video -->
        <template x-if="data.backgroundVideo">
            <video class="absolute inset-0 w-full h-full object-cover" autoplay muted loop playsinline>
                <source :src="data.backgroundVideo" type="video/mp4">
            </video>
        </template>

        <!-- Background Image (fallback or alternative) -->
        <template x-if="data.backgroundImage && !data.backgroundVideo">
            <div class="parallax-bg absolute inset-0"
                 :style="`background-image: url('${data.backgroundImage}')`"></div>
        </template>

        <!-- Dark Overlay -->
        <div class="parallax-overlay absolute inset-0"></div>

        <!-- Content -->
        <div class="relative z-10 max-w-7xl mx-auto w-full">
            <div class="text-center mb-20 fade-in-up">
                <p class="text-xs font-mono font-semibold tracking-[0.25em] uppercase text-red-400 mb-6 flex items-center justify-center gap-3">
                    <span class="w-10 h-[1px] bg-red-400"></span>
                    <span x-text="data.subtitle"></span>
                    <span class="w-10 h-[1px] bg-red-400"></span>
                </p>
                <h1 class="font-serif text-5xl md:text-7xl font-bold text-white mb-8 leading-tight" x-text="data.title"></h1>
                <p class="text-lg text-gray-300 max-w-2xl mx-auto mb-10 leading-relaxed" x-text="data.paragraph"></p>
                <button class="bg-red-800 text-white px-10 py-4 rounded-full font-medium hover:bg-red-900 transition-all hover:shadow-lg hover:shadow-red-800/40 hover:-translate-y-0.5" x-text="data.buttonText"></button>
            </div>
            <div class="flex items-center justify-center gap-3 flex-wrap fade-in-up">
                <template x-for="(card, index) in data.cards" :key="index">
                    <div class="flex items-center gap-3">
                        <div class="bg-white/10 backdrop-blur-md border-2 border-white/20 rounded-2xl px-10 py-5 text-center min-w-[140px] card-hover cursor-pointer hover:border-red-400 group">
                            <span class="text-lg font-semibold text-white group-hover:text-red-300 transition-colors" x-text="card.text"></span>
                        </div>
                        <template x-if="index < data.cards.length - 1">
                            <svg class="w-10 h-10 text-red-400/60 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
                            </svg>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <!-- ============================================ -->
    <!-- SECTION 2: Video/Image Slider                -->
    <!-- ============================================ -->
    <section class="py-20 bg-gray-950 overflow-hidden" id="section2"
             x-data="section2Data()" x-init="init()">
        <div class="max-w-7xl mx-auto mb-14 px-6">
            <div class="text-center fade-in-up">
                <p class="text-xs font-mono font-semibold tracking-[0.25em] uppercase text-red-400 mb-5" x-text="data.subtitle"></p>
                <h2 class="font-serif text-4xl md:text-6xl font-bold text-white mb-5" x-text="data.title"></h2>
                <p class="text-gray-400 max-w-2xl mx-auto text-lg" x-text="data.paragraph"></p>
            </div>
        </div>
        <div class="relative">
            <div class="flex slide-track" style="width: max-content;">
                <template x-for="(item, index) in [...data.items, ...data.items]" :key="index">
                    <div class="flex-shrink-0 mx-4 rounded-2xl overflow-hidden border-2 border-gray-800 relative group cursor-pointer" style="width: 440px; height: 300px;">
                        <img :src="item.image" :alt="item.title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent flex items-center justify-center">
                            <div class="w-20 h-20 bg-white/90 backdrop-blur rounded-full flex items-center justify-center shadow-2xl group-hover:scale-110 transition-transform duration-300">
                                <svg class="w-8 h-8 text-red-700 ml-1" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                            </div>
                        </div>
                        <div class="absolute bottom-0 left-0 right-0 p-6">
                            <p class="text-white font-semibold text-base" x-text="item.title"></p>
                            <p class="text-gray-300 text-sm mt-1" x-text="item.category"></p>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <!-- ============================================ -->
    <!-- SECTION 3: Current State to Desired State    -->
    <!-- ============================================ -->
    <section class="py-24 px-6 bg-white" id="section3"
             x-data="section3Data()" x-init="init()">
        <div class="max-w-7xl mx-auto">
            <div class="text-center mb-20 fade-in-up">
                <p class="text-xs font-mono font-semibold tracking-[0.25em] uppercase text-red-800 mb-5" x-text="data.subtitle"></p>
                <h2 class="font-serif text-4xl md:text-6xl font-bold text-gray-900 mb-6" x-text="data.title"></h2>
                <p class="text-lg text-gray-500 max-w-2xl mx-auto" x-text="data.paragraph"></p>
            </div>

            <div class="relative grid md:grid-cols-2 gap-10 mb-24 fade-in-up">
                <svg class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[200px] h-[300px] pointer-events-none z-10 hidden md:block" viewBox="0 0 200 300">
                    <path class="string-path" d="M 20 150 Q 100 50 180 150" stroke="#991b1b" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="6 4"/>
                    <circle cx="100" cy="80" r="5" fill="#991b1b" class="pulse-ring"/>
                </svg>

                <div class="bg-gradient-to-br from-red-50 to-stone-50 rounded-3xl p-10 border border-red-100 card-hover relative z-20">
                    <div class="flex items-center gap-3 mb-8">
                        <div class="w-14 h-14 bg-red-800 rounded-2xl flex items-center justify-center shadow-lg shadow-red-800/20">
                            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                            </svg>
                        </div>
                        <span class="text-xs font-mono font-semibold tracking-wider uppercase text-red-800">Current</span>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-900 mb-6" x-text="data.currentState.title"></h3>
                    <ul class="space-y-4">
                        <template x-for="item in data.currentState.items" :key="item">
                            <li class="flex items-start gap-3 text-gray-600">
                                <span class="w-2 h-2 bg-red-800 rounded-full mt-2 flex-shrink-0"></span>
                                <span x-text="item"></span>
                            </li>
                        </template>
                    </ul>
                </div>

                <div class="bg-gradient-to-br from-green-50 to-stone-50 rounded-3xl p-10 border border-green-100 card-hover relative z-20">
                    <div class="flex items-center gap-3 mb-8">
                        <div class="w-14 h-14 bg-green-700 rounded-2xl flex items-center justify-center shadow-lg shadow-green-700/20">
                            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <span class="text-xs font-mono font-semibold tracking-wider uppercase text-green-700">Desired</span>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-900 mb-6" x-text="data.desiredState.title"></h3>
                    <ul class="space-y-4">
                        <template x-for="item in data.desiredState.items" :key="item">
                            <li class="flex items-start gap-3 text-gray-600">
                                <span class="w-2 h-2 bg-green-700 rounded-full mt-2 flex-shrink-0"></span>
                                <span x-text="item"></span>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>

            <div class="grid md:grid-cols-3 gap-8 mb-20 fade-in-up">
                <template x-for="(card, index) in data.questionCards" :key="index">
                    <div class="bg-white rounded-2xl p-8 border border-gray-100 card-hover group">
                        <div class="w-12 h-12 bg-red-800 text-white rounded-2xl flex items-center justify-center text-lg font-bold mb-6 group-hover:scale-110 transition-transform" x-text="'0' + (index + 1)"></div>
                        <h4 class="text-xl font-bold text-gray-900 mb-3" x-text="card.title"></h4>
                        <p class="text-gray-500 text-sm leading-relaxed" x-text="card.text"></p>
                    </div>
                </template>
            </div>

            <div class="bg-gradient-to-br from-stone-50 to-stone-100 rounded-3xl p-12 md:p-16 border border-gray-100 fade-in-up">
                <div class="grid md:grid-cols-2 gap-12 items-center">
                    <div>
                        <span class="text-xs font-mono font-semibold tracking-wider uppercase text-red-800 mb-4 block">Our Framework</span>
                        <h3 class="text-3xl md:text-4xl font-bold text-gray-900 mb-8" x-text="data.bigCard.title"></h3>
                        <ul class="space-y-4">
                            <template x-for="item in data.bigCard.items" :key="item">
                                <li class="flex items-start gap-4 text-gray-700">
                                    <svg class="w-5 h-5 text-red-800 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                                    </svg>
                                    <span x-text="item"></span>
                                </li>
                            </template>
                        </ul>
                    </div>
                    <div class="rounded-2xl overflow-hidden shadow-2xl">
                        <img :src="data.bigCard.image" alt="Framework" class="w-full h-72 object-cover">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ============================================ -->
    <!-- SECTION 4: The Pathway                       -->
    <!-- ============================================ -->
    <section class="py-24 px-6 bg-stone-50" id="section4"
             x-data="section4Data()" x-init="init()">
        <div class="max-w-7xl mx-auto">
            <div class="text-center mb-20 fade-in-up">
                <p class="text-xs font-mono font-semibold tracking-[0.25em] uppercase text-red-800 mb-5" x-text="data.subtitle"></p>
                <h2 class="font-serif text-4xl md:text-6xl font-bold text-gray-900 mb-6" x-text="data.title"></h2>
                <p class="text-lg text-gray-500 max-w-2xl mx-auto" x-text="data.paragraph"></p>
            </div>
            <div class="grid md:grid-cols-3 gap-8 fade-in-up">
                <template x-for="(card, index) in data.cards" :key="index">
                    <div class="bg-white rounded-2xl p-8 border border-gray-100 card-hover group">
                        <div class="flex items-center justify-between mb-6">
                            <div class="w-14 h-14 bg-red-800 text-white rounded-2xl flex items-center justify-center text-lg font-bold group-hover:scale-110 transition-transform" x-text="'0' + (index + 1)"></div>
                            <svg class="w-5 h-5 text-gray-300 group-hover:text-red-800 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
                            </svg>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900 mb-3" x-text="card.title"></h3>
                        <p class="text-gray-500 text-sm mb-6 leading-relaxed" x-text="card.text"></p>
                        <button @click="$store.modal.openModal(card)" class="text-red-800 font-semibold text-sm hover:text-red-900 flex items-center gap-2 group/btn">
                            Explore
                            <svg class="w-4 h-4 group-hover/btn:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                            </svg>
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <!-- ============================================ -->
    <!-- SECTION 5: The Standard Inside Every Phase   -->
    <!-- ============================================ -->
    <section class="py-24 px-6 bg-white" id="section5"
             x-data="section5Data()" x-init="init()">
        <div class="max-w-7xl mx-auto">
            <div class="text-center mb-20 fade-in-up">
                <p class="text-xs font-mono font-semibold tracking-[0.25em] uppercase text-red-800 mb-5" x-text="data.subtitle"></p>
                <h2 class="font-serif text-4xl md:text-6xl font-bold text-gray-900 mb-6" x-text="data.title"></h2>
                <p class="text-lg text-gray-500 max-w-2xl mx-auto" x-text="data.paragraph"></p>
            </div>
            <div class="grid md:grid-cols-3 gap-8 fade-in-up">
                <template x-for="(card, index) in data.cards" :key="index">
                    <div class="bg-stone-50 rounded-2xl p-8 border border-gray-100 card-hover group">
                        <div class="flex items-center justify-between mb-6">
                            <div class="w-14 h-14 bg-red-800 text-white rounded-2xl flex items-center justify-center text-lg font-bold group-hover:scale-110 transition-transform" x-text="'0' + (index + 1)"></div>
                            <svg class="w-5 h-5 text-gray-300 group-hover:text-red-800 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
                            </svg>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900 mb-3" x-text="card.title"></h3>
                        <p class="text-gray-500 text-sm mb-6 leading-relaxed" x-text="card.text"></p>
                        <button @click="$store.modal.openModal(card)" class="text-red-800 font-semibold text-sm hover:text-red-900 flex items-center gap-2 group/btn">
                            Explore
                            <svg class="w-4 h-4 group-hover/btn:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                            </svg>
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <!-- ============================================ -->
    <!-- SECTION 6: Design With the People            -->
    <!-- ============================================ -->
    <section class="py-24 px-6 bg-gradient-to-b from-stone-50 to-white relative overflow-hidden" id="section6"
             x-data="section6Data()" x-init="init()">

        <div class="absolute top-0 right-0 w-96 h-96 bg-red-800/3 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
        <div class="absolute bottom-0 left-0 w-96 h-96 bg-red-800/3 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2"></div>

        <div class="max-w-7xl mx-auto relative z-10">

            <div class="text-center mb-24 fade-in-up">
                <p class="text-xs font-mono font-semibold tracking-[0.25em] uppercase text-red-800 mb-6 flex items-center justify-center gap-3">
                    <span class="w-10 h-[1px] bg-red-800"></span>
                    <span x-text="data.subtitle"></span>
                    <span class="w-10 h-[1px] bg-red-800"></span>
                </p>
                <h2 class="font-serif text-4xl md:text-6xl font-bold text-gray-900 mb-6 leading-tight" x-text="data.title"></h2>
                <p class="text-lg text-gray-500 max-w-2xl mx-auto italic" x-text="data.paragraph"></p>
            </div>

            <div class="grid lg:grid-cols-12 gap-16 items-start fade-in-up">

                <div class="lg:col-span-5 flex items-center justify-center">
                    <div class="relative" style="width: 480px; height: 480px;">

                        <div class="absolute inset-0 rounded-full border border-dashed border-gray-200 pulse-ring"></div>

                        <svg class="absolute inset-0 w-full h-full" viewBox="0 0 480 480">
                            <circle cx="240" cy="240" r="180" fill="none" stroke="#e7e5e4" stroke-width="1.5"/>

                            <template x-for="(item, index) in data.orbitItems" :key="index">
                                <line x1="240" y1="240"
                                      :x2="240 + 180 * Math.cos((index * 60 - 90) * Math.PI / 180)"
                                      :y2="240 + 180 * Math.sin((index * 60 - 90) * Math.PI / 180)"
                                      stroke="#f5f0eb" stroke-width="1" stroke-dasharray="4 4"/>
                            </template>

                            <line x1="240" y1="240"
                                  :x2="240 + 180 * Math.cos((activeIndex * 60 - 90) * Math.PI / 180)"
                                  :y2="240 + 180 * Math.sin((activeIndex * 60 - 90) * Math.PI / 180)"
                                  stroke="#991b1b" stroke-width="2" stroke-dasharray="6 3"
                                  class="transition-all duration-500"/>
                        </svg>

                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-44 h-44 rounded-full bg-gradient-to-br from-stone-100 to-stone-50 border-2 border-stone-200 flex items-center justify-center shadow-xl z-20">
                            <div class="text-center px-6">
                                <p class="text-[10px] font-mono font-bold tracking-[0.2em] uppercase text-red-800 mb-1">Centered on</p>
                                <p class="text-sm font-bold text-gray-900 leading-tight">PEOPLE WHO<br>LIVE THE<br>SYSTEM</p>
                            </div>
                        </div>

                        <template x-for="(item, index) in data.orbitItems" :key="index">
                            <div class="absolute orbit-node z-30"
                                 :style="`left: ${240 + 180 * Math.cos((index * 60 - 90) * Math.PI / 180) - 28}px; top: ${240 + 180 * Math.sin((index * 60 - 90) * Math.PI / 180) - 28}px;`"
                                 @mouseenter="activeIndex = index"
                                 @click="activeIndex = index">

                                <div class="w-14 h-14 rounded-full flex items-center justify-center transition-all duration-300"
                                     :class="activeIndex === index ? 'bg-red-800 shadow-lg shadow-red-800/30 active-dot-pulse' : 'bg-white border-2 border-stone-200 hover:border-red-800'">

    <!-- ============================================ -->
    <!-- JSON DATA & ALPINE COMPONENTS                -->

    <script>
        // ==========================================
        // GLOBAL MODAL STORE
        // ==========================================
        document.addEventListener('alpine:init', () => {
            Alpine.store('modal', {
                open: false,
                data: null,
                openModal(card) {
                    this.data = card;
                    this.open = true;
                    document.body.style.overflow = 'hidden';
                },
                closeModal() {
                    this.open = false;
                    this.data = null;
                    document.body.style.overflow = '';
                }
            });
        });

        // ==========================================
        // DATA LOADER HELPER (Loads JSON from data/approch/)
        // ==========================================
        async function loadData(filename) {
            try {
                const res = await fetch(`data/approch/${filename}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (err) {
                console.error(`Failed to load data/approch/${filename}:`, err);
                return null;
            }
        }

        // ==========================================
        // SECTION 1
        // ==========================================
        function section1Data() {
            return {
                data: { cards: [] },
                async init() {
                    const res = await loadData('section1.json');
                    if (res) this.data = res;
                    setTimeout(() => {
                        document.querySelectorAll('#section1 .fade-in-up').forEach(el => el.classList.add('visible'));
                    }, 100);
                }
            };
        }

        // ==========================================
        // SECTION 2
        // ==========================================
        function section2Data() {
            return {
                data: { items: [] },
                async init() {
                    const res = await loadData('section2.json');

                    }, 100);
                }
            };
        }

        // ==========================================
        // SECTION 3
        // ==========================================
        function section3Data() {
            return {
                data: {
                    currentState: { items: [] },
                    desiredState: { items: [] },
                    questionCards: [],
                    bigCard: { items: [] }
                },
                async init() {
                    const res = await loadData('section3.json');
                    if (res) this.data = res;
                    setTimeout(() => {
                        document.querySelectorAll('#section3 .fade-in-up').forEach(el => el.classList.add('visible'));
                        setTimeout(() => {
                            document.querySelectorAll('.string-path').forEach(p => p.classList.add('drawn'));
                        }, 500);
                    }, 100);
                }
            };
        }

        // ==========================================
        // SECTION 4
        // ==========================================
        function section4Data() {
            return {
                data: { cards: [] },
                async init() {
                    const res = await loadData('section4.json');

        // ==========================================
        // SECTION 5
        // ==========================================

            return {
                data: { cards: [] },

                    const res = await loadData('section5.json');
                    if (res) this.data = res;
                    setTimeout(() => {
                        document.querySelectorAll('#section5 .fade-in-up').forEach(el => el.classList.add('visible'));
                    }, 100);
                }
            };
        }

        // ==========================================
        // SECTION 6
        // ==========================================
        function section6Data() {
            return {
                data: { orbitItems: [], tags: [] },
                activeIndex: 0,
                getLabelPosition(index) {
                    const angle = (index * 60 - 90) * Math.PI / 180;
                    let translateX = 0, translateY = 0;
                    if (Math.cos(angle) > 0.3) translateX = 20;
                    else if (Math.cos(angle) < -0.3) translateX = -80;
                    else translateX = -30;
                    if (Math.sin(angle) > 0.3) translateY = 20;
                    else if (Math.sin(angle) < -0.3) translateY = -10;
                    else translateY = 10;
                    return `transform: translate(${translateX}px, ${translateY}px);`;
                },
                async init() {
